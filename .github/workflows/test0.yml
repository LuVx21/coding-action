name: 测试用0

on:
  workflow_dispatch:

jobs:
  jobId1:
    name: 任务1
    runs-on: ubuntu-latest
    steps:
      - name: 下载工具
        id: download-tool
        uses: ./.github/actions/download
        env:
          TAG: 5.3.0
        with:
          repo: upx/upx
          tag: v${{ env.TAG }}
          fileName: upx-${{ env.TAG }}-amd64_linux.tar.xz

      - name: 使用下载的文件
        run: |
          "${{ steps.download-tool.outputs.file-path }}" --version
