name: 测试用0

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 仓库名，格式为 owner/repo
        required: true
      tag:
        description: Tag，latest 表示最新 Release
        required: false
        default: 'latest'
      fileName:
        description: Release 中的文件名，必须精确匹配
        required: true


jobs:
  jobId1:
    name: 任务1
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 下载工具
        id: download-tool
        uses: ./.github/actions/download
        with:
          repo: ${{ inputs.repo }}
          tag: ${{ inputs.tag }}
          fileName: ${{ inputs.fileName }}

      - name: 使用下载的文件
        run: |
          find "${{ steps.download-tool.outputs.file-path }}" -maxdepth 5
